name: Build Windows Installer

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-msi:
    runs-on: windows-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Check files
      run: |
        dir
        dir libs-repo\org\jetbrains\jediterm\jediterm-core\3.64\
        
    - name: Download Gradle
      run: |
        Invoke-WebRequest -Uri "https://services.gradle.org/distributions/gradle-8.7-bin.zip" -OutFile "$env:TEMP\gradle.zip"
        Expand-Archive -Path "$env:TEMP\gradle.zip" -DestinationPath "$env:TEMP"
        echo "$env:TEMP\gradle-8.7\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
        
    - name: Build MSI
      run: gradle packageMsi --no-daemon --stacktrace
      
    - name: Upload MSI
      uses: actions/upload-artifact@v4
      with:
        name: cssm-windows-installer
        path: build/compose/binaries/main/msi/*.msi
        retention-days: 30
